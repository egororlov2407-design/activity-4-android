name: Build Activity 3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate or extract project
        id: project
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find . \
            -type f -name package.json \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 4 \
              -type f -name '*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No package.json or ZIP archive found."
              echo "Repository contents:"
              find . -maxdepth 4 -type f | head -100
              exit 1
            fi

            mkdir -p extracted-project
            unzip -oq "$ZIP_FILE" -d extracted-project

            PACKAGE_FILE=$(find extracted-project \
              -type f -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit)
          fi

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: ZIP contains no package.json."
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Check JavaScript
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run check:js

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f android/gradlew ]; then
            echo "Android project already exists"
          else
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Activity-3.0-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
