name: Build Activity 3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project folder
        id: project
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f activity3-android/package.json ]; then
            echo "dir=activity3-android" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: package.json not found"
            find . -maxdepth 3 -name package.json
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Check JavaScript
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run check:js

      - name: Generate Android project if needed
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f android/gradlew ]; then
            echo "Android project already exists"
          else
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Activity-3.0-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
