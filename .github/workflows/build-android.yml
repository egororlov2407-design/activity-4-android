
name: Build Activity 3.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find project
        id: project
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find . -type f -name package.json \
            -not -path './.git/*' \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Check JavaScript
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run check:js

      - name: Prepare Android platform
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f android/gradlew ]; then
            echo "Existing Android project found"
          elif [ -d android ]; then
            echo "Android folder exists but Gradle wrapper is missing"
            find android -maxdepth 3 -type f | head -100
            exit 1
          elif [ -f capacitor.config.json ] || [ -f capacitor.config.ts ] || [ -f capacitor.config.js ]; then
            npx cap add android
          else
            echo "ERROR: Capacitor configuration is missing"
            ls -la
            exit 1
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Activity-3.0-APK
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

